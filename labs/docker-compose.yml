# ScopeLens lab fixtures (Build Plan §7).
#
# Separate stack from the dev stack, on its own isolated network. Run one stack at a
# time until resource use is known (Build Plan §7).
#
# Isolation properties, all deliberate:
#   * `internal: true`          — fixtures get no route out, so a vulnerable fixture
#                                 cannot reach the internet or call back to a third party.
#   * loopback-only publishing  — operator access binds 127.0.0.1, never 0.0.0.0.
#   * static addresses          — the addresses in deploy/lab_services.yaml are the ones
#                                 the operator authorizes; they do not drift on restart.
#   * synthetic data only       — see fixtures/*/html.
#
# No ground-truth, answer-key or challenge-solution endpoint is reachable from here.
name: scopelens-labs

networks:
  # Where the fixtures live. No route out.
  #
  # Named explicitly (rather than left to Compose's project prefix) because the dev stack
  # joins it as an external network so the proxy can reach the fixtures. A stable name is
  # what makes `make labs-up` then `make run` work in that order.
  labs_net:
    name: scopelens_labs_net
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24

  # Carries the loopback-published ports. Docker cannot publish from an internal
  # network, so the edge forwarder spans both. Only labs-edge is attached to this one;
  # no fixture has a route out.
  labs_edge:
    driver: bridge

x-nginx-common: &nginx-common
  image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
  networks:
    labs_net:
  restart: unless-stopped

services:
  labs-discovery-a:
    profiles: [discovery]
    image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
    command: ["python", "/fixture/app.py", "--variant", "bad"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      labs_net:
        ipv4_address: 172.28.0.19
    volumes:
      - ./discovery:/fixture:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20
  labs-discovery-b:
    profiles: [discovery]
    image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
    command: ["python", "/fixture/app.py", "--variant", "fixed"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      labs_net:
        ipv4_address: 172.28.0.21
    volumes:
      - ./discovery:/fixture:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20
  labs-callbacks:
    profiles: [callbacks]
    image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
    command: ["python", "/fixture/app.py"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      labs_net:
        ipv4_address: 172.28.0.18
    volumes:
      - ./callbacks:/fixture:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20
  labs-browser-workflows:
    image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
    command: ["python", "/fixture/app.py"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      labs_net:
        ipv4_address: 172.28.0.16
    volumes:
      - ./expansion_browser:/fixture:ro
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/foreign')"]
      interval: 3s
      timeout: 3s
      retries: 20
  labs-validation:
    image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
    command: ["python", "/fixture/server.py"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      labs_net:
        ipv4_address: 172.28.0.15
    volumes:
      - ./fixtures/validation:/fixture:ro
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20
  labs-active:
    image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
    command: ["python", "/fixture/server.py"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      labs_net:
        ipv4_address: 172.28.0.14
    volumes:
      - ./fixtures/active:/fixture:ro
    tmpfs: [/tmp]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8080/bad/xss?q=scopelens', timeout=2); assert b'scopelens' in response.read()"]
      interval: 3s
      timeout: 3s
      retries: 20
  labs-edge:
    # Fixed-destination port forwarder. See fixtures/edge/nginx.conf for why this is
    # not an egress path for the fixtures.
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: scopelens-labs-edge
    networks:
      labs_net:
        ipv4_address: 172.28.0.10
      labs_edge:
    ports:
      - "127.0.0.1:8081:8081"   # labs-bad  http
      - "127.0.0.1:8082:8082"   # labs-good http
      - "127.0.0.1:8443:8443"   # labs-bad  https
      - "127.0.0.1:8444:8444"   # labs-good https
      - "127.0.0.1:8085:8085"   # labs-validation, evaluator only
    volumes:
      - ./fixtures/edge/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      labs-validation:
        condition: service_healthy
      labs-bad:
        condition: service_healthy
      labs-good:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8081 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  labs-bad:
    <<: *nginx-common
    container_name: scopelens-labs-bad
    depends_on:
      labs-active:
        condition: service_healthy
    networks:
      labs_net:
        ipv4_address: 172.28.0.11
    volumes:
      - ./fixtures/bad/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./fixtures/bad/html:/usr/share/nginx/html:ro
      - ./fixtures/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  labs-good:
    <<: *nginx-common
    container_name: scopelens-labs-good
    depends_on:
      labs-active:
        condition: service_healthy
    networks:
      labs_net:
        ipv4_address: 172.28.0.12
    volumes:
      - ./fixtures/good/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./fixtures/good/html:/usr/share/nginx/html:ro
      - ./fixtures/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # Opt-in only (`make labs-up-juice`). Not started by default: Build Plan §7 says to
  # run one stack at a time until resource use is known, and Juice Shop is not needed
  # for any M0 deliverable.
  juice-shop:
    profiles: ["juice-shop"]
    image: bkimminich/juice-shop:v19.2.1@sha256:b3450d951d98b607805b21a4b9b4da7451b334c804ad93a79fcee490b3a7c5ad
    container_name: scopelens-labs-juice-shop
    networks:
      labs_net:
        ipv4_address: 172.28.0.20
    restart: unless-stopped

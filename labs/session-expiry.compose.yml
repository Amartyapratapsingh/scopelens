# Add to labs/docker-compose.yml. Owned synthetic fixtures have no published ports.
x-expiry-common: &expiry-common
  image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
  user: "65534:65534"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  volumes:
    - ./session_expiry:/fixture:ro
  tmpfs: [/tmp]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
    interval: 3s
    timeout: 3s
    retries: 20

services:
  labs-session-expiry-a:
    <<: *expiry-common
    container_name: scopelens-labs-session-expiry-a
    command: ["python", "/fixture/app.py", "--host", "0.0.0.0", "--port", "8080", "--vulnerable"]
    networks:
      labs_net:
        ipv4_address: 172.28.0.25
  labs-session-expiry-b:
    <<: *expiry-common
    container_name: scopelens-labs-session-expiry-b
    command: ["python", "/fixture/app.py", "--host", "0.0.0.0", "--port", "8080"]
    networks:
      labs_net:
        ipv4_address: 172.28.0.26

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 30;

    # FIXTURE (C06): verbose tokens. The exact nginx version is disclosed in Server headers,
    # which the component control reports as an informational candidate.
    server_tokens on;

    # -------------------------------------------------------------------------------------
    # Cleartext HTTP. Serves content directly with NO redirect to HTTPS.
    #
    # Deliberate misconfigurations, each the vulnerable half of a control's fixture pair:
    #   C01 redirect  no redirect to HTTPS, so an application response is served in the clear
    #   C01 HSTS      no Strict-Transport-Security header
    #   C02 cookie    session cookie with no Secure, HttpOnly or SameSite, plus an explicit
    #                 Domain attribute that widens it beyond the origin
    #   C04 CSP       no Content-Security-Policy
    #   C04 frame     neither frame-ancestors nor X-Frame-Options
    #   C04 XCTO      no X-Content-Type-Options
    #   C04 referrer  no Referrer-Policy
    #   C05 listing   autoindex enabled on /files/
    #   C05 files     /.env, /backup.sql and /.git/config served
    #   C05 errors    /error-debug.html renders a fabricated stack trace
    #   C07 methods   an Allow header advertising PUT and DELETE
    # -------------------------------------------------------------------------------------
    server {
        listen 80 default_server;
        server_name labs-bad;
        root /usr/share/nginx/html;
        index index.html;

        add_header Set-Cookie "sessionid=SYNTHETIC-bad-fixture-session; Path=/; Domain=172.28.0.11" always;
        add_header Allow "GET, HEAD, PUT, DELETE, OPTIONS" always;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # FIXTURE (C05): directory listing enabled.
        location /files/ {
            autoindex on;
            autoindex_localtime on;
        }

        # FIXTURE (C05): exposed sensitive-looking files.
        #
        # The URLs are realistic but the files on disk deliberately are not named `.env`. A
        # file literally called `.env` is caught by common gitignore rules — including global
        # ones a project cannot override — and would silently vanish from a fresh clone.
        location = /.env {
            alias /usr/share/nginx/html/fixture-files/synthetic-dotenv.txt;
            default_type text/plain;
        }
        location = /backup.sql {
            alias /usr/share/nginx/html/fixture-files/synthetic-backup.sql;
            default_type text/plain;
        }
        location = /.git/config {
            alias /usr/share/nginx/html/fixture-files/synthetic-git-config.txt;
            default_type text/plain;
        }

        # FIXTURE (C07): an API-shaped route, for the same-origin API inventory.
        location = /api {
            default_type application/json;
            return 200 '{"service":"fixture","note":"synthetic lab fixture, no real data"}';
        }

        location /active/ {
            proxy_pass http://172.28.0.14:8080/bad/;
        }

        location = /cors-config {
            default_type application/json;
            add_header Access-Control-Allow-Origin $http_origin;
            add_header Access-Control-Allow-Credentials true;
            return 200 '{"public":"synthetic fixture"}';
        }
        location = /redirect-config {
            return 302 $arg_next;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }

    # -------------------------------------------------------------------------------------
    # HTTPS listener. Same misconfigurations, so each control behaves identically over TLS.
    #
    # The certificate is SELF-SIGNED (issuer == subject), which is the vulnerable half of the
    # TLS control's fixture pair. Generated by labs/scripts/seed.sh.
    # -------------------------------------------------------------------------------------
    server {
        listen 8443 ssl;
        server_name labs-bad;
        root /usr/share/nginx/html;
        index index.html;

        ssl_certificate     /etc/nginx/certs/labs-bad.crt;
        ssl_certificate_key /etc/nginx/certs/labs-bad.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Set-Cookie "sessionid=SYNTHETIC-bad-fixture-session; Path=/; Domain=172.28.0.11" always;
        add_header Allow "GET, HEAD, PUT, DELETE, OPTIONS" always;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location /files/ {
            autoindex on;
        }

        location = /.env {
            alias /usr/share/nginx/html/fixture-files/synthetic-dotenv.txt;
            default_type text/plain;
        }
        location = /backup.sql {
            alias /usr/share/nginx/html/fixture-files/synthetic-backup.sql;
            default_type text/plain;
        }
        location = /.git/config {
            alias /usr/share/nginx/html/fixture-files/synthetic-git-config.txt;
            default_type text/plain;
        }
        location = /api {
            default_type application/json;
            return 200 '{"service":"fixture","note":"synthetic lab fixture, no real data"}';
        }

        location /active/ {
            proxy_pass http://172.28.0.14:8080/bad/;
        }

        location = /cors-config {
            default_type application/json;
            add_header Access-Control-Allow-Origin $http_origin;
            add_header Access-Control-Allow-Credentials true;
            return 200 '{"public":"synthetic fixture"}';
        }
        location = /redirect-config {
            return 302 $arg_next;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 30;

    # FIXTURE (C06): no version disclosure.
    server_tokens off;

    # -------------------------------------------------------------------------------------
    # Cleartext HTTP. Redirects to HTTPS instead of serving content, so this origin never
    # serves an application response in the clear.
    # -------------------------------------------------------------------------------------
    server {
        listen 80 default_server;
        server_name labs-good;

        # Health endpoint is exempt from the redirect so readiness can be checked with a
        # plain HTTP GET that does not depend on TLS trust.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }


        location /active/ {
            proxy_pass http://172.28.0.14:8080/good/;
        }

        location = /cors-config {
            default_type application/json;
            return 200 '{"public":"synthetic fixture"}';
        }
        location = /redirect-config {
            return 302 /;
        }

        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    # -------------------------------------------------------------------------------------
    # HTTPS listener: the fixed counterpart of labs-bad. Every header below is the corrected
    # form of a control the bad fixture is missing.
    #
    # The certificate is signed by the fixture CA, so issuer != subject — the fixed half of
    # the TLS control's fixture pair. It is not in a system trust store; see
    # docs/MILESTONES.md for that limitation.
    # -------------------------------------------------------------------------------------
    server {
        listen 8443 ssl;
        server_name labs-good;
        root /usr/share/nginx/html;
        index index.html;

        ssl_certificate     /etc/nginx/certs/labs-good.crt;
        ssl_certificate_key /etc/nginx/certs/labs-good.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # C01: HSTS, long max-age, subdomains included.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        # C04: content-type sniffing disabled.
        add_header X-Content-Type-Options "nosniff" always;
        # C04: an enforcing policy, and frame protection via frame-ancestors.
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; object-src 'none'" always;
        # C04: no referrer leakage.
        add_header Referrer-Policy "no-referrer" always;
        # C02: session cookie fully flagged and with no Domain attribute, so it stays
        # host-only rather than being presented to subdomains.
        add_header Set-Cookie "sessionid=SYNTHETIC-good-fixture-session; Path=/; Secure; HttpOnly; SameSite=Strict" always;
        # C07: only the methods this origin actually serves.
        add_header Allow "GET, HEAD" always;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Owned HTTPS transport and narrow-path gate. Only a synthetic supplied
        # cookie qualifies the account header; scanner execution has no login route.
        location = /app {
            default_type text/html;
            return 200 '<html><body><a href="/app/identity-home">Synthetic application</a></body></html>';
        }
        location = /app/identity-home {
            if ($http_cookie != "identity-ready=synthetic-https-valid") { return 401; }
            default_type text/html;
            return 200 '<html><body><div class="user-menu"><a class="dropdown-toggle"><span class="hidden-xs">synthetic-https-identity</span></a></div></body></html>';
        }


        # No autoindex anywhere: a directory request is not listable.
        location /files/ {
            autoindex off;
            try_files $uri $uri/ =404;
        }

        # Files that exist on the bad fixture do not exist here.
        location = /.env      { return 404; }
        location = /backup.sql { return 404; }
        location = /.git/config { return 404; }
        # A debug page that would disclose internals does not exist here either.
        location = /error-debug.html { return 404; }

        location = /api {
            default_type application/json;
            return 200 '{"service":"fixture","note":"synthetic lab fixture, no real data"}';
        }

        location /active/ {
            proxy_pass http://172.28.0.14:8080/good/;
        }

        location = /cors-config {
            default_type application/json;
            return 200 '{"public":"synthetic fixture"}';
        }
        location = /redirect-config {
            return 302 /;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}

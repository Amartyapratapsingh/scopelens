worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

# Edge forwarder for the lab fixtures.
#
# WHY THIS EXISTS
# The fixtures sit on an `internal: true` Docker network, so they have no route to the
# internet or the host — a vulnerable fixture cannot call back to a third party
# (Build Plan §7, "default-deny outbound").
#
# But Docker cannot publish ports from an internal network, which would leave the
# operator unable to run the readiness and fixture-verification checks that M0
# requires. So this container is attached to both networks: the internal one where the
# fixtures live, and a normal one that carries the loopback-published ports.
#
# WHY THIS IS NOT AN EGRESS HOLE
# Every `proxy_pass` below is a fixed destination. This is a port forwarder, not a
# general proxy: nothing can ask it to reach an arbitrary host. A fixture that
# connected to these listeners would only ever be forwarded back to another fixture.
# The fixtures themselves remain on the internal network with no outbound route.
stream {
    server {
        listen 8085;
        proxy_pass labs-validation:8080;
    }
    log_format edge '$remote_addr -> $upstream_addr ($status)';
    access_log /var/log/nginx/access.log edge;

    # HTTP
    server {
        listen 8081;
        proxy_pass labs-bad:80;
    }
    server {
        listen 8082;
        proxy_pass labs-good:80;
    }

    # HTTPS. A stream proxy passes bytes through untouched, so the certificate the
    # operator observes is the fixture's own — not this forwarder's.
    server {
        listen 8443;
        proxy_pass labs-bad:8443;
    }
    server {
        listen 8444;
        proxy_pass labs-good:8443;
    }
}

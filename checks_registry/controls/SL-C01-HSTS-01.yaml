id: SL-C01-HSTS-01
title: HTTP Strict Transport Security is missing or does not establish an effective policy
canonical_control: transport.hsts.effective_policy
root_cause: hsts-not-enforced
category: C01
standards:
  wstg_v42:
  - WSTG-CONF-07
  cwe:
  - CWE-319
  owasp_top10_2025: []
  asvs_500: []
  api_top10_2023: []
  mapping_review: reviewed
availability:
  profiles:
  - external-configuration
  - external-dast
  phase: M2
  stance: OBSERVE
  family: F33
applicability:
  description: Applies to any HTTPS origin in scope that returns a successful response.
  evidence_required: A response captured by the scanner from the scope origin.
  not_applicable_when: The scope origin is cleartext HTTP only, recorded with the evidence that no HTTPS
    listener exists.
prerequisites:
  credentials: none
  fixtures: labs-bad (vulnerable) and labs-good (fixed)
  notes: ''
allowed_action:
  destinations: scope origin only
  methods:
  - GET
  - HEAD
  max_requests: 0
  max_response_bytes: 1048576
  timeout_seconds: 10.0
side_effects:
  expectation: "none \u2014 reads responses already collected during recon"
  cleanup: none required
  stop_conditions:
  - the scope origin is unreachable
  - the authorization for this scope has expired
detection:
  signal: An HTTPS response from the origin carries no Strict-Transport-Security header, or carries one
    whose max-age does not establish a policy.
  negative_controls:
  - labs-good sends max-age=63072000; includeSubDomains and must produce no finding
  - a response captured over cleartext HTTP must not be used to judge HSTS
  confirmation_criteria: Confirmed when a header is absent from a response the scanner observed over TLS
    from the scope origin, or when a present header fails the effective-policy criteria. The captured
    response must be stored as evidence.
  false_positive_considerations:
  - HSTS is ignored by browsers over cleartext HTTP, so a missing header on an HTTP response is not this
    finding.
  - A short max-age may be a deliberate rollout choice; the observed value is reported and intent treated
    as unverified.
  - Preload status is not observable from a response and must not be asserted.
fixtures:
  vulnerable: labs-bad sends no Strict-Transport-Security header
  fixed: labs-good sends max-age=63072000; includeSubDomains
  verified: true
tool_version: "not applicable \u2014 implemented directly in Python"
mandatory: true
coverage_weight: 1
review_state: enabled
owner: Aditya Pratap Singh
last_reviewed: '2026-09-25'

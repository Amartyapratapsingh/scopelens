id: SL-C02-COOKIE-02
title: Session cookie is scoped more broadly than the application that set it
canonical_control: session.cookie.scope
root_cause: session-cookie-over-broad-scope
category: C02
standards:
  wstg_v42:
  - WSTG-SESS-02
  cwe:
  - CWE-668
  owasp_top10_2025: []
  asvs_500: []
  api_top10_2023: []
  mapping_review: reviewed
availability:
  profiles:
  - external-configuration
  - external-dast
  phase: M2
  stance: OBSERVE
  family: F40
applicability:
  description: Applies to session-shaped cookies observed being set by the origin.
  evidence_required: A response captured by the scanner from the scope origin.
  not_applicable_when: No session-shaped cookie was observed, in which case scope is unassessed rather
    than clean.
prerequisites:
  credentials: none
  fixtures: labs-bad (vulnerable) and labs-good (fixed)
  notes: ''
allowed_action:
  destinations: scope origin only
  methods:
  - GET
  - HEAD
  max_requests: 0
  max_response_bytes: 1048576
  timeout_seconds: 10.0
side_effects:
  expectation: "none \u2014 reads responses already collected during recon"
  cleanup: none required
  stop_conditions:
  - the scope origin is unreachable
  - the authorization for this scope has expired
detection:
  signal: A session-shaped cookie carries a Domain attribute, presenting it to subdomains as well as the
    origin that set it.
  negative_controls:
  - labs-good sets no Domain attribute and must produce no finding
  - a cookie scoped to an unrelated domain is not this finding; the browser would reject it
  confirmation_criteria: "Confirmed when a session-shaped cookie's Set-Cookie header, as received, contains\
    \ a Domain attribute. A host-only cookie \u2014 no Domain attribute at all \u2014 is the correct configuration\
    \ and produces no finding."
  false_positive_considerations:
  - A multi-application deployment may intend a shared cookie. The finding states the scope and treats
    intent as unverified.
  - An explicit Domain that happens to match the origin's own host still widens the cookie to subdomains,
    which is the reported behaviour.
fixtures:
  vulnerable: labs-bad sets sessionid with an explicit Domain attribute
  fixed: labs-good sets sessionid with no Domain attribute (host-only)
  verified: true
tool_version: "not applicable \u2014 implemented directly in Python"
mandatory: true
coverage_weight: 1
review_state: enabled
owner: Aditya Pratap Singh
last_reviewed: '2026-09-25'

id: SL-C04-FRAME-01
title: 'Page can be framed by another origin: neither CSP frame-ancestors nor X-Frame-Options is set'
canonical_control: browser.frame_protection.effective
root_cause: frame-protection-absent
category: C04
standards:
  wstg_v42: []

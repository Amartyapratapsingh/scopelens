  - external-configuration
  - external-dast
  phase: M2
  stance: OBSERVE
  family: F41
applicability:
  description: Applies when the scope declares a transport-only cleartext origin for this check.
  evidence_required: A response captured by the scanner from the scope origin.
  not_applicable_when: Missing HTTP authorization is NOT_TESTED, never N/A. A separately approved transport_http_port

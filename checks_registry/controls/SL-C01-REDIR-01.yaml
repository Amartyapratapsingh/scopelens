  confirmation_criteria: Confirmed when the scanner observed the cleartext origin return a 2xx response,
    rather than a 3xx to an https target, on the transport-only origin the scope explicitly authorizes
    for this check.
  false_positive_considerations:
  - Only a redirect to the approved HTTPS host and port passes. Errors and unrelated redirects are inconclusive.

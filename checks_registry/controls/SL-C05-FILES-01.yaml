id: SL-C05-FILES-01
title: A well-known sensitive path is served to any visitor
canonical_control: exposure.sensitive_files
root_cause: sensitive-file-exposed
category: C05
standards:
  wstg_v42:
  - WSTG-CONF-03
  - WSTG-CONF-04
  cwe:
  - CWE-538
  - CWE-552
  owasp_top10_2025: []
  asvs_500: []
  api_top10_2023: []
  mapping_review: reviewed
availability:
  profiles:
  - external-configuration
  - external-dast
  phase: M2
  stance: ACTIVE
  family: F36
applicability:
  description: Applies to any scope origin; the paths are probed once each during the crawl.
  evidence_required: A response captured by the scanner from the scope origin.
  not_applicable_when: None of the bounded probes produced a response, which is unassessed rather than
    clean.
prerequisites:
  credentials: none
  fixtures: labs-bad (vulnerable) and labs-good (fixed)
  notes: ''
allowed_action:
  destinations: scope origin only
  methods:
  - GET
  - HEAD
  max_requests: 3
  max_response_bytes: 1048576
  timeout_seconds: 10.0
side_effects:
  expectation: three GET requests to fixed well-known paths; no state change
  cleanup: none required
  stop_conditions:
  - the scope origin is unreachable
  - the authorization for this scope has expired
detection:
  signal: One of a fixed, bounded set of sensitive paths (/.env, /backup.sql, /.git/config) returns 200
    with a body where it should return 404.
  negative_controls:
  - labs-bad serves /.env, /backup.sql and /.git/config and all three must be found
  - labs-good returns 404 for each of them and must produce no finding
  - 'tests/unit/test_m2_controls.py: empty 200, HTML soft 404, missing and blocked paths'
  confirmation_criteria: Nonempty non-HTML file-specific content at a reviewed path, distinct from the
    captured negative-control response. Record each required path; missing, blocked or truncated instances
    cannot complete coverage.
  false_positive_considerations:
  - A path that returns a styled 404 page with status 200 would be a false positive; the recorded evidence
    lets a reviewer see the status and size.
  - The probe set is fixed and small. It is a bounded check, not content discovery, and a path absent
    from it is not evidence of anything.
fixtures:
  vulnerable: labs-bad serves /.env, /backup.sql and /.git/config with HTTP 200
  fixed: labs-good returns 404 for all three
  verified: true
tool_version: "not applicable \u2014 implemented directly in Python"
mandatory: true
coverage_weight: 1
review_state: enabled
owner: Aditya Pratap Singh
last_reviewed: '2026-09-25'

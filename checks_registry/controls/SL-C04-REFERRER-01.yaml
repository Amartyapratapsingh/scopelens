id: SL-C04-REFERRER-01
title: Referrer-Policy is missing, so the browser default decides cross-origin leakage
canonical_control: browser.referrer_policy.present
root_cause: referrer-policy-absent
category: C04
standards:
  wstg_v42: []
  cwe:
  - CWE-200
  owasp_top10_2025: []
  asvs_500: []
  api_top10_2023: []
  mapping_review: reviewed
availability:
  profiles:
  - external-configuration
  - external-dast
  phase: M2
  stance: OBSERVE
  family: F33
applicability:
  description: Applies to HTML responses collected over TLS from the scope origin.
  evidence_required: A response captured by the scanner from the scope origin.
  not_applicable_when: No HTTPS HTML response was collected, which is unassessed rather than clean.
prerequisites:
  credentials: none
  fixtures: labs-bad (vulnerable) and labs-good (fixed)
  notes: ''
allowed_action:
  destinations: scope origin only
  methods:
  - GET
  - HEAD
  max_requests: 0
  max_response_bytes: 1048576
  timeout_seconds: 10.0
side_effects:
  expectation: "none \u2014 reads responses already collected during recon"
  cleanup: none required
  stop_conditions:
  - the scope origin is unreachable
  - the authorization for this scope has expired
detection:
  signal: An HTTPS HTML response carries no Referrer-Policy header.
  negative_controls:
  - 'labs-good sends Referrer-Policy: no-referrer and must produce no finding'
  - the check does not follow a link to observe a Referer header; it reads the policy
  confirmation_criteria: Confirmed when the header is absent from a response the scanner collected over
    TLS from the origin and stored as evidence.
  false_positive_considerations:
  - A policy may legitimately be set by a reverse proxy rather than the application; the finding describes
    the observed response.
  - Some policies leak more than others; this control reports absence and does not rank the values.
fixtures:
  vulnerable: labs-bad sends no Referrer-Policy header
  fixed: 'labs-good sends Referrer-Policy: no-referrer'
  verified: true
tool_version: "not applicable \u2014 implemented directly in Python"
mandatory: true

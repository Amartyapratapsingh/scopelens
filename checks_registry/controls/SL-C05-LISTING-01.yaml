id: SL-C05-LISTING-01
title: A directory renders an index of its contents
canonical_control: exposure.directory_listing
root_cause: directory-listing-enabled
category: C05
standards:
  wstg_v42:
  - WSTG-CONF-02
  cwe:
  - CWE-548
  owasp_top10_2025: []
  asvs_500: []
  api_top10_2023: []
  mapping_review: reviewed
availability:
  profiles:
  - external-configuration
  - external-dast
  phase: M2
  stance: OBSERVE
  family: F34
applicability:
  description: Applies to successful HTML responses collected during the crawl.
  evidence_required: A response captured by the scanner from the scope origin.
  not_applicable_when: No successful HTML response was collected, which is unassessed rather than clean.
prerequisites:
  credentials: none
  fixtures: labs-bad (vulnerable) and labs-good (fixed)
  notes: ''
allowed_action:
  destinations: scope origin only
  methods:
  - GET
  - HEAD
  max_requests: 0
  max_response_bytes: 1048576
  timeout_seconds: 10.0
side_effects:
  expectation: "none \u2014 reads responses already collected during recon"
  cleanup: none required
  stop_conditions:
  - the scope origin is unreachable
  - the authorization for this scope has expired
detection:
  signal: 'A successful HTML response renders a directory index: an ''Index of /'' title or heading, Apache''s
    autoindex table, or an IIS directory listing.'
  negative_controls:
  - labs-bad serves a listable /files/ and must be found
  - labs-good returns 404 for /files/ and must produce no finding
  confirmation_criteria: 'Confirmed when index markup is matched in the body of a 200 response the scanner
    collected. No recursive download is performed: the finding is that the directory is listable, not
    an inventory of what is in it.'
  false_positive_considerations:
  - A page that merely lists file names in prose is not an autoindex; the signatures are specific to generated
    listings.
  - "Recursive enumeration of a listed directory is prohibited by Spec \xA710.3 and is not performed."
fixtures:
  vulnerable: labs-bad enables autoindex on /files/
  fixed: labs-good disables autoindex and returns 404
  verified: true
tool_version: "not applicable \u2014 implemented directly in Python"
mandatory: true
coverage_weight: 1
review_state: enabled

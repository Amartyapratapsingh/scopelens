id: SL-C01-TLS-01
title: TLS certificate validation, expiry and legacy protocol support
canonical_control: transport.tls.certificate_validity
root_cause: tls-certificate-not-usable
category: C01
standards:
  wstg_v42:
  - WSTG-CRYP-01
  cwe:
  - CWE-295
  - CWE-327
  owasp_top10_2025: []
  asvs_500: []
  api_top10_2023: []
  mapping_review: reviewed
availability:
  profiles:
  - external-configuration
  - external-dast
  phase: M2
  stance: OBSERVE
  family: F41
applicability:
  description: Applies to any scope whose scheme is https and whose port accepts a TLS handshake.
  evidence_required: A TLS measurement from the constrained lane for the scope host and port.
  not_applicable_when: The scope declares a cleartext-only origin. Recorded with the reason; an unreachable
    TLS listener is inconclusive, not N/A.
prerequisites:
  credentials: none
  fixtures: labs-bad (vulnerable) and labs-good (fixed)
  notes: ''
allowed_action:
  destinations: scope origin only
  methods:
  - GET
  - HEAD
  max_requests: 0
  max_response_bytes: 1048576
  timeout_seconds: 10.0
side_effects:
  expectation: "none \u2014 reads responses already collected during recon"
  cleanup: none required
  stop_conditions:
  - the scope origin is unreachable
  - the authorization for this scope has expired
detection:
  signal: The trusted TLS lane verifies chain, host and validity at capture time, and separately offers
    TLS 1.0 and 1.1.
  negative_controls:
  - labs-good presents a CA-signed certificate with a future notAfter, which must produce no finding
  - the proxy's own intercepting certificate must never be the artifact this control reads
  confirmation_criteria: Recorded verification failure, expiry/near-expiry, or an accepted legacy handshake.
    Missing measurements remain unassessed.
  false_positive_considerations:
  - Lab measurements use the explicit fixture CA; production uses the system trust store.
  - An inconclusive legacy handshake cannot prove rejection.
fixtures:
  vulnerable: labs-bad serves a self-signed certificate (issuer equals subject); tests/unit/test_m2_tls.py
    covers expired, future and wrong-host certificates
  fixed: labs-good serves a certificate signed by the fixture CA (issuer differs from subject)
  verified: true
tool_version: "not applicable \u2014 implemented directly in Python"
mandatory: true
coverage_weight: 1
review_state: enabled
owner: Aditya Pratap Singh
last_reviewed: '2026-09-25'

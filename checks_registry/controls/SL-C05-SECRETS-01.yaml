id: SL-C05-SECRETS-01
title: Delivered client-side content contains a value shaped like a private credential
canonical_control: exposure.client_side_secret_candidates
root_cause: client-side-secret-candidate
category: C05
standards:
  wstg_v42:
  - WSTG-INFO-05
  cwe:
  - CWE-540
  - CWE-798
  owasp_top10_2025: []
  asvs_500: []
  api_top10_2023: []
  mapping_review: reviewed
availability:
  profiles:
  - external-configuration
  - external-dast
  phase: M2
  stance: FLAG
  family: F37
applicability:
  description: Applies to delivered JavaScript and HTML collected during the crawl.
  evidence_required: A response captured by the scanner from the scope origin.
  not_applicable_when: No delivered script or HTML was collected, which is unassessed rather than clean.
prerequisites:
  credentials: none
  fixtures: labs-bad (vulnerable) and labs-good (fixed)
  notes: ''
allowed_action:
  destinations: scope origin only
  methods:
  - GET
  - HEAD
  max_requests: 0
  max_response_bytes: 1048576
  timeout_seconds: 10.0
side_effects:
  expectation: "none \u2014 reads responses already collected during recon"
  cleanup: none required
  stop_conditions:
  - the scope origin is unreachable
  - the authorization for this scope has expired
detection:
  signal: 'Delivered JavaScript or HTML contains a value shaped like a private credential: an OpenAI-style
    key, an AWS access key id, a GitHub token, a private key block or a JWT.'
  negative_controls:
  - labs-bad delivers a value shaped like a private key, which must appear as a candidate
  - labs-good delivers only a publishable key, which must produce no finding at all
  confirmation_criteria: "Never confirmed by this profile. Spec \xA710.5 gives this family the FLAG stance,\
    \ and Spec \xA710.2 requires distinguishing a public client identifier from private material. The\
    \ control therefore reports a candidate and holds the overall score at Verification pending rather\
    \ than asserting a leak."
  false_positive_considerations:
  - A revoked, example or test key has the same shape as a live one; shape matching cannot tell them apart.
  - "Spec \xA710.2 forbids authenticating with a discovered credential, so the ambiguity is reported rather\
    \ than resolved."
  - A document containing a recognised public identifier alongside a private-shaped one is treated as
    possibly a key pair and reported at low confidence.
fixtures:
  vulnerable: labs-bad delivers fixture-files/app-secrets.js containing an sk-shaped value
  fixed: labs-good delivers app-config.js containing only a publishable pk_test_ key

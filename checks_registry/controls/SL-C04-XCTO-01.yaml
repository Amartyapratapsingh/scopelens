id: SL-C04-XCTO-01
title: X-Content-Type-Options is missing, so responses may be MIME-sniffed
canonical_control: browser.content_type_sniffing.prevented
root_cause: content-type-sniffing-not-disabled
category: C04
standards:
  wstg_v42: []
  cwe:
  - CWE-693
  - CWE-436
  owasp_top10_2025: []
  asvs_500: []
  api_top10_2023: []
  mapping_review: reviewed
availability:
  profiles:
  - external-configuration
  - external-dast
  phase: M2
  stance: OBSERVE
  family: F33
applicability:
  description: Applies to successful responses whose content type a browser might reinterpret.
  evidence_required: A response captured by the scanner from the scope origin.
  not_applicable_when: No successful response was collected, which is unassessed rather than clean.
prerequisites:
  credentials: none
  fixtures: labs-bad (vulnerable) and labs-good (fixed)
  notes: ''
allowed_action:
  destinations: scope origin only
  methods:
  - GET
  - HEAD
  max_requests: 0
  max_response_bytes: 1048576
  timeout_seconds: 10.0
side_effects:
  expectation: "none \u2014 reads responses already collected during recon"
  cleanup: none required
  stop_conditions:
  - the scope origin is unreachable
  - the authorization for this scope has expired
detection:
  signal: 'A response whose content type a browser could reinterpret is served without X-Content-Type-Options:
    nosniff.'
  negative_controls:
  - 'labs-good sends X-Content-Type-Options: nosniff and must produce no finding'
  - an image or font response is not reported, because a browser will not reinterpret it
  confirmation_criteria: Confirmed when the scanner observed a response from the scope origin that lacks
    the header or sends a value other than nosniff, and whose content type is one a browser may reinterpret.
  false_positive_considerations:
  - Responses whose content type browsers do not sniff are skipped; reporting them would inflate the count
    without describing anything exploitable.
  - 'Presence alone is not the test: the value must establish the policy.'
  - This is a defence-in-depth gap, not a demonstrated exploit; severity reflects a missing protection.

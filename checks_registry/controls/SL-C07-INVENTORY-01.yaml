id: SL-C07-INVENTORY-01
title: Same-origin API surface is enumerated and recorded as inventory
canonical_control: api.same_origin_inventory
root_cause: api-surface-not-enumerated
category: C07
standards:
  wstg_v42:
  - WSTG-INFO-07
  cwe: []
  owasp_top10_2025: []
  asvs_500: []
  api_top10_2023: []
  mapping_review: reviewed
availability:
  profiles:
  - external-configuration
  - external-dast
  phase: M2
  stance: OBSERVE
  family: F16
applicability:
  description: Applies whenever the crawl enumerated at least one route.
  evidence_required: A response captured by the scanner from the scope origin.
  not_applicable_when: The crawl enumerated no routes, in which case the API surface is unknown rather
    than clean.
prerequisites:
  credentials: none
  fixtures: labs-bad (vulnerable) and labs-good (fixed)
  notes: ''
allowed_action:
  destinations: scope origin only
  methods:
  - GET
  - HEAD
  max_requests: 0
  max_response_bytes: 1048576
  timeout_seconds: 10.0
side_effects:
  expectation: "none \u2014 reads responses already collected during recon"
  cleanup: none required
  stop_conditions:
  - the scope origin is unreachable
  - the authorization for this scope has expired
detection:
  signal: The crawl enumerated the same-origin routes, and the API-shaped subset is recorded.
  negative_controls:
  - both fixtures serve /api, so both must enumerate at least one API-shaped route
  - a crawl that enumerated no routes must be inconclusive, not a pass
  confirmation_criteria: "This control's claim is about coverage, not weakness. It passes when the same-origin\
    \ route set was enumerated and recorded \u2014 a verifiable statement about what was looked at. It\
    \ raises nothing, and its summary says so, because an unevaluated API is not a secure one."
  false_positive_considerations:
  - Discovering an API route is not finding a broken authorization check, and this unauthenticated profile
    has no identity with which to test one.
  - "The route list belongs in the endpoint inventory; turning discovery into a finding is the conflation\
    \ Spec \xA710.2 warns about."
fixtures:
  vulnerable: labs-bad serves /api, which must appear in the inventory
  fixed: labs-good serves /api, which must appear in the inventory
  verified: true
tool_version: "not applicable \u2014 implemented directly in Python"
mandatory: true
coverage_weight: 1

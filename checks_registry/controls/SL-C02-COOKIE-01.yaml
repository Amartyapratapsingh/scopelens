id: SL-C02-COOKIE-01
title: Session cookie is set without Secure, HttpOnly or SameSite protections
canonical_control: session.cookie.protective_flags
root_cause: session-cookie-missing-protective-flags
category: C02
standards:
  wstg_v42:
  - WSTG-SESS-02
  cwe:
  - CWE-614
  - CWE-1004
  - CWE-1275
  owasp_top10_2025: []
  asvs_500: []
  api_top10_2023: []
  mapping_review: reviewed
availability:
  profiles:
  - external-configuration
  - external-dast
  phase: M2
  stance: OBSERVE
  family: F40
applicability:
  description: Applies to cookies the origin sets that carry session or authentication state, judged from
    the cookie's own name.
  evidence_required: A response captured by the scanner from the scope origin.
  not_applicable_when: The origin sets no cookies on any assessed response, recorded with the responses
    observed and the routes covered.
prerequisites:
  credentials: none
  fixtures: labs-bad (vulnerable) and labs-good (fixed)
  notes: ''
allowed_action:
  destinations: scope origin only
  methods:
  - GET
  - HEAD
  max_requests: 0
  max_response_bytes: 1048576
  timeout_seconds: 10.0
side_effects:
  expectation: "none \u2014 reads responses already collected during recon"
  cleanup: none required
  stop_conditions:
  - the scope origin is unreachable
  - the authorization for this scope has expired
detection:
  signal: A cookie whose name indicates session or authentication state is set without Secure, HttpOnly
    or SameSite, or with SameSite=None and no Secure.
  negative_controls:
  - labs-good sets sessionid with Secure; HttpOnly; SameSite=Strict and must produce no finding
  - a non-session cookie such as a theme preference must not be reported for missing flags
  confirmation_criteria: Confirmed when a cookie the scanner observed the origin setting, and whose name
    indicates session or authentication state, lacks the specific attribute being reported. The evidence
    is the Set-Cookie attribute set as received, with the cookie value redacted before storage.
  false_positive_considerations:
  - 'Cookie values are never stored: they are redacted to [redacted] before the artifact is written.'
  - A missing Secure flag on a cleartext-only origin is a different, larger finding; it is not double-counted
    here.
  - Non-session cookies may legitimately omit flags. Reporting every unflagged cookie is treated as a
    false positive.
fixtures:
  vulnerable: labs-bad sets sessionid with no Secure, HttpOnly or SameSite
  fixed: labs-good sets sessionid with Secure; HttpOnly; SameSite=Strict
  verified: true
tool_version: "not applicable \u2014 implemented directly in Python"
mandatory: true
coverage_weight: 1
review_state: enabled
owner: Aditya Pratap Singh
last_reviewed: '2026-09-25'

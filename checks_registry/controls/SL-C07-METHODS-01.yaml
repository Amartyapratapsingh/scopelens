id: SL-C07-METHODS-01
title: The origin advertises HTTP methods beyond those an ordinary page needs
canonical_control: api.http_method_exposure
root_cause: unusual-http-methods-advertised
category: C07
standards:
  wstg_v42:
  - WSTG-CONF-06
  cwe:
  - CWE-200
  owasp_top10_2025: []
  asvs_500: []
  api_top10_2023: []
  mapping_review: reviewed
availability:
  profiles:
  - external-configuration
  - external-dast
  phase: M2
  stance: OBSERVE
  family: F39
applicability:
  description: Applies to any collected response carrying an Allow header.
  evidence_required: A response captured by the scanner from the scope origin.
  not_applicable_when: No response advertised an Allow header, in which case the control passes with that
    stated basis.
prerequisites:
  credentials: none
  fixtures: labs-bad (vulnerable) and labs-good (fixed)
  notes: ''
allowed_action:
  destinations: scope origin only
  methods:
  - GET
  - HEAD
  max_requests: 0
  max_response_bytes: 1048576
  timeout_seconds: 10.0
side_effects:
  expectation: "none \u2014 reads responses already collected during recon"
  cleanup: none required
  stop_conditions:
  - the scope origin is unreachable
  - the authorization for this scope has expired
detection:
  signal: A response's Allow header advertises a method outside GET, HEAD, OPTIONS and POST.
  negative_controls:
  - labs-bad advertises PUT, DELETE and OPTIONS, which must appear as a candidate
  - labs-good advertises only GET and HEAD, which must produce no finding
  confirmation_criteria: "Never confirmed. Spec \xA710.2 and F39 are explicit that an advertised method\
    \ is not a flaw: proving support would mean invoking it, and destructive verbs are not invoked to\
    \ see whether they work. The control reports an informational candidate."
  false_positive_considerations:
  - PUT and DELETE are legitimate API methods; their advertisement is inventory, not a weakness.
  - 'No destructive verb is ever sent: the control reads the advertised list and stops.'
fixtures:
  vulnerable: 'labs-bad sends Allow: GET, HEAD, PUT, DELETE, OPTIONS'
  fixed: 'labs-good sends Allow: GET, HEAD'
  verified: true
tool_version: "not applicable \u2014 implemented directly in Python"
mandatory: false

id: SL-C04-CSP-01
title: Content-Security-Policy is missing or does not restrict script execution
canonical_control: browser.content_security_policy.effective
root_cause: csp-absent-or-ineffective
category: C04
standards:
  wstg_v42: []
  cwe:
  - CWE-693
  owasp_top10_2025: []
  asvs_500: []
  api_top10_2023: []
  mapping_review: reviewed
availability:
  profiles:
  - external-configuration
  - external-dast
  phase: M2
  stance: OBSERVE
  family: F33
applicability:
  description: Applies to HTML responses collected over TLS from the scope origin.
  evidence_required: A response captured by the scanner from the scope origin.
  not_applicable_when: No HTTPS HTML response was collected, which is unassessed rather than clean.
prerequisites:
  credentials: none
  fixtures: labs-bad (vulnerable) and labs-good (fixed)
  notes: ''
allowed_action:
  destinations: scope origin only
  methods:
  - GET
  - HEAD
  max_requests: 0
  max_response_bytes: 1048576
  timeout_seconds: 10.0
side_effects:
  expectation: "none \u2014 reads responses already collected during recon"
  cleanup: none required
  stop_conditions:
  - the scope origin is unreachable
  - the authorization for this scope has expired
detection:
  signal: An HTTPS HTML response carries no Content-Security-Policy header, carries it only in report-only
    mode, or carries a policy restricting neither default-src nor script-src.
  negative_controls:
  - labs-good sets default-src 'self'; frame-ancestors 'none'; object-src 'none' and must produce no finding
  - a report-only policy enforces nothing and is treated as absent, not as present
  confirmation_criteria: Effective enforcing policies must restrict script source and inline execution.
    Evaluate repeated policies as intersections and first duplicate directive wins; report-only is insufficient.
  false_positive_considerations:
  - ADD-01 asks for effective-policy evaluation, not presence. A policy that exists but constrains nothing
    is the finding.
  - unsafe-inline and unsafe-eval are extremely common and context-dependent; this control does not judge
    them.
fixtures:
  vulnerable: labs-bad sends no Content-Security-Policy header
  fixed: labs-good sends a policy enforcing default-src 'self'
  verified: true
tool_version: "not applicable \u2014 implemented directly in Python"
mandatory: true
coverage_weight: 1
review_state: enabled
owner: Aditya Pratap Singh
last_reviewed: '2026-09-25'

id: SL-C01-MIXED-01
title: An HTTPS page loads an active subresource over cleartext HTTP
canonical_control: transport.https.mixed_content
root_cause: mixed-active-content
category: C01
standards:
  wstg_v42:
  - WSTG-CRYP-03
  cwe:
  - CWE-311
  owasp_top10_2025: []
  asvs_500: []
  api_top10_2023: []
  mapping_review: reviewed
availability:
  profiles:
  - external-configuration
  - external-dast
  phase: M2
  stance: OBSERVE
  family: F41
applicability:
  description: Applies to HTML responses collected from an HTTPS origin.
  evidence_required: A response captured by the scanner from the scope origin.
  not_applicable_when: No HTTPS HTML response was collected. A page that was never reached is inconclusive,
    not N/A.
prerequisites:
  credentials: none
  fixtures: labs-bad (vulnerable) and labs-good (fixed)
  notes: ''
allowed_action:
  destinations: scope origin only
  methods:
  - GET
  - HEAD
  max_requests: 0
  max_response_bytes: 1048576
  timeout_seconds: 10.0
side_effects:
  expectation: "none \u2014 reads responses already collected during recon"
  cleanup: none required
  stop_conditions:
  - the scope origin is unreachable
  - the authorization for this scope has expired
detection:
  signal: Delivered HTML from an HTTPS origin contains a src or href attribute whose scheme is http.
  negative_controls:
  - labs-good's only HTML page contains no cleartext subresource and must produce no finding
  - a cleartext reference in a page served over cleartext HTTP is a different finding (SL-C01-REDIR-01),
    not this one
  confirmation_criteria: Confirmed when the cleartext reference is read from the delivered HTML of a response
    the scanner collected over TLS from the scope origin.
  false_positive_considerations:
  - Passive mixed content (images, media) is blocked silently by current browsers and is not reported;
    only active subresources are.
  - A URL in body text that looks like a link but is not a src or href attribute is not a subresource.
fixtures:
  vulnerable: labs-bad serves /error-debug.html with a cleartext script src
  fixed: labs-good serves no page with a cleartext subresource
  verified: true
tool_version: "not applicable \u2014 implemented directly in Python"
mandatory: true
coverage_weight: 1
review_state: enabled
owner: Aditya Pratap Singh
last_reviewed: '2026-09-25'

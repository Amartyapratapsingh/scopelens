id: SL-C05-ERRORS-01
title: A response body discloses a stack trace or framework error page
canonical_control: exposure.verbose_error_disclosure
root_cause: verbose-error-disclosure
category: C05
standards:
  wstg_v42:
  - WSTG-ERRH-01
  - WSTG-ERRH-02
  cwe:
  - CWE-209
  - CWE-211
  owasp_top10_2025: []
  asvs_500: []
  api_top10_2023: []
  mapping_review: reviewed
availability:
  profiles:
  - external-configuration
  - external-dast
  phase: M2
  stance: OBSERVE
  family: F35
applicability:
  description: Applies to every response body collected during the crawl.
  evidence_required: A response captured by the scanner from the scope origin.
  not_applicable_when: No response body was collected, which is unassessed rather than clean.
prerequisites:
  credentials: none
  fixtures: labs-bad (vulnerable) and labs-good (fixed)
  notes: ''
allowed_action:
  destinations: scope origin only
  methods:
  - GET
  - HEAD
  max_requests: 0
  max_response_bytes: 1048576
  timeout_seconds: 10.0
side_effects:
  expectation: "none \u2014 reads responses already collected during recon"
  cleanup: none required
  stop_conditions:
  - the scope origin is unreachable
  - the authorization for this scope has expired
detection:
  signal: 'A collected response body contains a signature of a thrown error or stack trace: a Python traceback,
    a Java stack frame, a PHP notice, a framework exception page.'
  negative_controls:
  - labs-bad serves a fabricated traceback at /error-debug.html, which must be found
  - labs-good serves no such page, and its 404 body must not match any signature
  confirmation_criteria: Confirmed when a signature is matched in the body of a response the scanner collected
    and stored as evidence. The finding reports that internal detail is disclosed, not an inferred exploit.
  false_positive_considerations:
  - Documentation that legitimately quotes a stack trace is a false positive; the signatures are framework-shaped
    rather than generic.
  - Generating an unusual error to provoke a traceback is a reviewed check, not part of this OBSERVE control.
fixtures:
  vulnerable: labs-bad serves /error-debug.html containing a fabricated Python traceback
  fixed: labs-good returns 404 for that path and discloses no internal detail
  verified: true
tool_version: "not applicable \u2014 implemented directly in Python"
mandatory: true
coverage_weight: 1
review_state: enabled
owner: Aditya Pratap Singh
last_reviewed: '2026-09-25'

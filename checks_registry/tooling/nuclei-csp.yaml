id: scopelens-csp-observation
info:
  name: HTML response without enforced CSP
  author: scopelens
  severity: info
  description: Configuration observation only; confirmation belongs to the registered CSP proof rule.
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    redirects: false
    max-redirects: 0
    matchers-condition: and
    matchers:
      - type: word
        part: header
        words: ["text/html"]
        case-insensitive: true
      - type: word
        part: header
        words: ["content-security-policy:"]
        case-insensitive: true
        negative: true
